{% extends 'base.html' %}

{% block title %}Criar Conta - AgroTrack{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <h2>Criar Nova Conta</h2>
    <form action="{{ url_for('registro') }}" method="POST">
        <div style="margin-bottom: 1rem;">
            <label for="usuario">Usuário desejado:</label>
            <input type="text" id="usuario" name="usuario" required style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="senha">Senha (mínimo 6 caracteres):</label>
            <input type="password" id="senha" name="senha" required style="width: 100%; padding: 8px; margin-top: 4px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #1b5e20; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Cadastrar</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">Já possui conta? <a href="{{ url_for('login') }}">Faça Login</a></p>
</div>
{% endblock %}
